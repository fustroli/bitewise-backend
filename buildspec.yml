version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - npm ci
  build:
    commands:
      - npm run build

artifacts:
  files:
    - appspec.yml
    - scripts/**/*
    - dist/**/*
    - package.json
    - package-lock.json
    - tsconfig.json
    - tsconfig.build.json
    - nest-cli.json
