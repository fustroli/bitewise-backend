version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - npm install -g bun@1.4.3
      - bun install --frozen-lockfile
  build:
    commands:
      - bun run build

artifacts:
  files:
    - appspec.yml
    - scripts/**/*
    - dist/**/*
    - package.json
    - bun.lock
    - tsconfig.json
    - tsconfig.build.json
    - nest-cli.json
