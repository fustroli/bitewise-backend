version: 0.0
os: linux
files:
  - source: /
    destination: /home/ubuntu/bitewise-backend
file_exists_behavior: OVERWRITE
permissions:
  - object: /home/ubuntu/bitewise-backend
    pattern: "**"
    owner: ubuntu
    group: ubuntu
    type:
      - file
      - directory
hooks:
  ApplicationStop:
    - location: scripts/stop.sh
      timeout: 30
      runas: ubuntu
  AfterInstall:
    - location: scripts/install_dependencies.sh
      timeout: 300
      runas: ubuntu
  ApplicationStart:
    - location: scripts/start.sh
      timeout: 60
      runas: ubuntu
  ValidateService:
    - location: scripts/validate.sh
      timeout: 30
      runas: ubuntu
