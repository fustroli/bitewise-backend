name: Integration tests

on:
  pull_request:

jobs:
  test-int:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Testcontainers starts MySQL via the runner's Docker daemon
      - run: npm run test:int
